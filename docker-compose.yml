services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      APP_TENANCY_MODE: COLUMN
      APP_TENANCY_HEADER: X-Tenant-Id
      APP_TENANCY_CLAIM: tenant_id
      APP_SECURITY_JWT_HS256_ENABLED: "true"
      APP_SECURITY_JWT_HS256_SECRET: "change-me-change-me-change-me-32bytes!!"
    ports:
      - "8080:8080"

volumes:
  pgdata:
